<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shop | Nova</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">
<div class="logo">
<a href="index.html">Shopverse</a>
</div>

<ul class="nav-links">
<li><a href="index.html">Store</a></li>
<li><a href="shop.html">Products</a></li>
<li><a href="cart.html">Cart (<span id="cart-count">0</span>)</a></li>
<li id="admin-link"></li>
</ul>
</nav>

<section class="products">

<h2>All Products</h2>

<input type="text" id="searchInput" placeholder="Search products..." onkeyup="searchProducts()">

<!-- Category Filters -->
<div class="filter-buttons">
<button onclick="filterProducts('all')">All</button>
<button onclick="filterProducts('electronics')">Electronics</button>
<button onclick="filterProducts('accessories')">Accessories</button>
</div>

<div class="product-grid" id="product-list">
</div>

<div class="card" data-category="electronics">
<img src="images/headphone.jpg">
<h3>Wireless Headphones</h3>
<p>$199</p>
<button onclick="addToCart('Wireless Headphones',199,'images/headphone.jpg')">Add to Cart</button>
</div>

<div class="card" data-category="electronics">
<img src="images/watch.jpg">
<h3>Smart Watch</h3>
<p>$249</p>
<button onclick="addToCart('Smart Watch',249,'images/watch.jpg')">Add to Cart</button>
</div>

<div class="card" data-category="electronics">
<img src="images/speaker.jpg">
<h3>Bluetooth Speaker</h3>
<p>$149</p>
<button onclick="addToCart('Bluetooth Speaker',149,'images/speaker.jpg')">Add to Cart</button>
</div>

<div class="card" data-category="accessories">
<img src="images/mouse.jpg">
<h3>Gaming Mouse</h3>
<p>$79</p>
<button onclick="addToCart('Gaming Mouse',79,'images/mouse.jpg')">Add to Cart</button>
</div>

</div>

</section>

<footer>
<p>© 2026 Shopverse. All rights reserved.</p>
</footer>

<script src="script.js"></script>

</body>
</html>
